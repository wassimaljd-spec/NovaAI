<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nova AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Top App Bar -->
  <header class="app-header">
    <div class="header-left">
      <button class="hamburger-btn" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <!-- Corner Star Logo Badge (Using logo.svg) -->
      <div class="nav-brand-icon">
        <img src="logo.svg" alt="Nova AI Logo" class="brand-logo-img" />
      </div>

      <div class="nav-brand-text">
        <h1 class="brand-name">Nova AI</h1>
        <p class="brand-sub">Always ready to help</p>
      </div>
    </div>
    <button class="pill-btn-new">+ New chat</button>
  </header>

  <!-- Hero Content -->
  <main class="hero-screen">
    
    <!-- Central Glowing Star Logo Badge (Using logo.svg) -->
    <div class="star-logo-container">
      <img src="logo.svg" alt="Nova AI Main Logo" class="hero-logo-img" />
    </div>

    <!-- Stylized NOVA AI Vector Title -->
    <div class="nova-title-container">
      <svg viewBox="0 0 320 50" class="nova-title-svg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="novaTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="60%" stop-color="#e9d5ff" />
            <stop offset="100%" stop-color="#a855f7" />
          </linearGradient>
        </defs>
        <g fill="url(#novaTextGrad)">
          <!-- N -->
          <path d="M 10 40 L 10 10 L 18 10 L 32 30 L 32 10 L 40 10 L 40 40 L 32 40 L 18 20 L 18 40 Z" />
          <!-- O -->
          <path d="M 52 10 L 76 10 C 82 10 86 14 86 20 L 86 30 C 86 36 82 40 76 40 L 52 40 C 46 40 42 36 42 30 L 42 20 C 42 14 46 10 52 10 Z M 52 17 C 50 17 49 18 49 20 L 49 30 C 49 32 50 33 52 33 L 76 33 C 78 33 79 32 79 30 L 79 20 C 79 18 78 17 76 17 Z" />
          <!-- V -->
          <path d="M 92 10 L 100 10 L 109 32 L 118 10 L 126 10 L 113 40 L 105 40 Z" />
          <!-- A (Custom Λ Chevron) -->
          <path d="M 132 40 L 145 10 L 153 10 L 166 40 L 158 40 L 149 18 L 140 40 Z" />
          <!-- A (Custom Λ Chevron for AI) -->
          <path d="M 190 40 L 203 10 L 211 10 L 224 40 L 216 40 L 207 18 L 198 40 Z" />
          <!-- I -->
          <path d="M 232 10 L 240 10 L 240 40 L 232 40 Z" />
        </g>
      </svg>
    </div>

    <!-- Tagline -->
    <p class="tagline">Think ✦ Create ✦ Explore</p>

    <h2 class="hero-prompt">What can I help you with?</h2>
    <p class="hero-description">
      Ask me anything. I'm here to help you learn, create and explore.
    </p>

    <!-- Chips Layout -->
    <div class="chips-group">
      <div class="chip-row">
        <button class="prompt-chip">💡 Explain something</button>
        <button class="prompt-chip">✍️ Help me write</button>
        <button class="prompt-chip">🚀 Give me an idea</button>
      </div>
    </div>

  </main>

  <!-- Bottom Input Bar -->
  <div class="input-dock-fixed">
    <div class="input-bar">
      <input type="text" placeholder="Type your message..." readonly />
      <button class="send-circle-btn">➔</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
