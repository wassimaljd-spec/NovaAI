<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nova AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="top-nav">
    <div class="nav-left">
      <button class="menu-btn" aria-label="Open Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="brand-avatar">
        <span>✦</span>
      </div>
      <div class="brand-info">
        <h1 class="brand-title">Nova AI</h1>
        <p class="brand-subtitle">Always ready to help</p>
      </div>
    </div>
    <button class="new-chat-pill">+ New chat</button>
  </header>

  <!-- Main Hero Screen -->
  <main class="hero-container">
    
    <!-- Rocket Icon Container -->
    <div class="rocket-badge">
      <span class="rocket-emoji">🚀</span>
    </div>

    <!-- Centered Headings -->
    <h2 class="main-heading">What can I help you with?</h2>
    <p class="sub-heading">Ask me anything. I'm here to help you learn, create and explore.</p>

    <!-- Prompt Chips Grid -->
    <div class="chips-wrapper">
      <div class="chip-row">
        <button class="pill-chip">💡 Explain something</button>
        <button class="pill-chip">✍️ Help me write</button>
      </div>
      <div class="chip-row single">
        <button class="pill-chip">🚀 Give me an idea</button>
      </div>
    </div>

  </main>

  <!-- Bottom Input Bar Area -->
  <div class="bottom-dock">
    <div class="input-pill">
      <input type="text" placeholder="Message Nova AI..." disabled />
      <button class="send-btn-purple">➔</button>
    </div>
  </div>

</body>
</html>
