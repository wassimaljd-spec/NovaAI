<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nova AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Top App Bar -->
  <header class="app-header">
    <div class="header-left">
      <button class="hamburger-btn" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="nav-brand-icon">
        <span>✦</span>
      </div>
      <div class="nav-brand-text">
        <h1 class="brand-name">Nova AI</h1>
        <p class="brand-sub">Always ready to help</p>
      </div>
    </div>
    <button class="pill-btn-new">+ New chat</button>
  </header>

  <!-- Hero Content -->
  <main class="hero-screen">
    
    <!-- Glowing Rocket Container -->
    <div class="rocket-container">
      <span class="rocket-icon">🚀</span>
    </div>

    <h2 class="hero-title">What can I help you with?</h2>
    <p class="hero-description">
      Ask me anything. I'm here to help you learn, create and explore.
    </p>

    <!-- Chips Layout -->
    <div class="chips-group">
      <div class="chip-row">
        <button class="prompt-chip">💡 Explain something</button>
        <button class="prompt-chip">✍️ Help me write</button>
      </div>
      <div class="chip-row center">
        <button class="prompt-chip">🚀 Give me an idea</button>
      </div>
    </div>

  </main>

  <!-- Bottom Input Bar -->
  <div class="input-dock-fixed">
    <div class="input-bar">
      <input type="text" placeholder="Type a message..." readonly />
      <button class="send-circle-btn">➔</button>
    </div>
  </div>

</body>
</html>
