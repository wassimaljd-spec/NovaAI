<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova AI</title>
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top right, #200b3b, #0c051a 60%, #05020a);
      --sidebar-bg: rgba(15, 8, 30, 0.65);
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(147, 112, 219, 0.25);
      --accent-purple: #7042d2;
      --accent-light: #9d65ff;
      --text-main: #ffffff;
      --text-muted: #a095bf;
      --user-msg-bg: #4c32b9;
      --bot-msg-bg: rgba(255, 255, 255, 0.07);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: var(--sidebar-bg);
      backdrop-filter: blur(12px);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: radial-gradient(circle, #b17aff, #5d28b8);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px rgba(162, 107, 255, 0.5);
    }

    .brand-title {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .brand-subtitle {
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-new-chat {
      background: rgba(112, 66, 210, 0.25);
      border: 1px solid rgba(157, 101, 255, 0.4);
      color: #fff;
      padding: 12px 16px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      font-size: 0.9rem;
      margin-bottom: 12px;
      transition: all 0.2s ease;
    }

    .btn-new-chat:hover {
      background: rgba(112, 66, 210, 0.4);
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      color: var(--text-muted);
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
    }

    .sidebar-footer {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 16px;
      position: relative;
    }

    .sidebar-footer p {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .footer-sparkle {
      position: absolute;
      bottom: 12px;
      right: 12px;
      color: var(--accent-light);
    }

    /* Main Container */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      padding: 16px 32px;
    }

    .icon-btn {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .status-badge {
      background: rgba(112, 66, 210, 0.2);
      border: 1px solid var(--accent-purple);
      padding: 6px 14px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: #00ff88;
      border-radius: 50%;
      box-shadow: 0 0 6px #00ff88;
    }

    /* Chat Body */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 0 20% 24px 20%;
      display: flex;
      flex-direction: column;
    }

    .hero-section {
      text-align: center;
      margin: 20px 0 30px 0;
    }

    .hero-logo {
      width: 110px;
      height: 110px;
      margin: 0 auto 16px auto;
      background: radial-gradient(circle, #a26bff 0%, #3e127a 70%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 40px rgba(147, 95, 255, 0.4);
      position: relative;
    }

    .hero-title {
      font-size: 2.2rem;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }

    .hero-subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* Action Chips */
    .chips-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 40px;
    }

    .chip {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.85rem;
    }

    .chip:hover {
      background: rgba(147, 112, 219, 0.15);
      border-color: var(--accent-light);
    }

    /* Messages Thread */
    .messages-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: auto;
    }

    .message-row {
      display: flex;
      gap: 12px;
      max-width: 75%;
    }

    .message-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 0.75rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .message-content {
      display: flex;
      flex-direction: column;
    }

    .bubble {
      padding: 12px 18px;
      border-radius: 18px;
      font-size: 0.9rem;
      line-height: 1.4;
      background: var(--user-msg-bg);
      border-top-right-radius: 4px;
    }

    .timestamp {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      justify-content: flex-end;
    }

    /* Input Dock */
    .input-dock {
      padding: 0 20% 24px 20%;
    }

    .input-container {
      background: rgba(20, 10, 38, 0.75);
      border: 1px solid var(--accent-purple);
      border-radius: 30px;
      padding: 8px 12px 8px 18px;
      display: flex;
      align-items: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .input-container input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 0.95rem;
      padding: 8px 0;
    }

    .input-container input::placeholder {
      color: var(--text-muted);
    }

    .input-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-icon {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
    }

    .btn-send {
      background: var(--accent-light);
      border: none;
      color: #fff;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .btn-send:active {
      transform: scale(0.95);
    }

    /* Responsiveness */
    @media (max-width: 900px) {
      .sidebar { display: none; }
      .chat-container, .input-dock { padding-left: 5%; padding-right: 5%; }
      .chips-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div>
      <div class="brand">
        <div class="brand-icon">✦</div>
        <div>
          <div class="brand-title">NOVA AI</div>
          <div class="brand-subtitle">Think ✦ Create ✦ Explore</div>
        </div>
      </div>

      <button class="btn-new-chat" id="newChatBtn">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
        New Chat
      </button>

      <div class="nav-list">
        <div class="nav-item">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          Chat History
        </div>
        <div class="nav-item">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"></path></svg>
          Settings
        </div>
      </div>
    </div>

    <div class="sidebar-footer">
      <p>Better questions create a brighter future. ✦</p>
      <div class="footer-sparkle">✦</div>
    </div>
  </aside>

  <!-- Main View -->
  <main class="main-content">
    <header class="top-bar">
      <button class="icon-btn">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path></svg>
      </button>
      <div class="status-badge">
        <span>✦ Nova AI</span>
        <span class="status-dot"></span>
      </div>
    </header>

    <div class="chat-container">
      <section class="hero-section">
        <div class="hero-logo">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.5">
            <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/>
          </svg>
        </div>
        <h1 class="hero-title">NOVA AI</h1>
        <p class="hero-subtitle">Your AI assistant &nbsp;✦&nbsp; Always here for you</p>
      </section>

      <section class="chips-grid">
        <div class="chip" onclick="handleChipClick('Explain something')">💡 Explain something</div>
        <div class="chip" onclick="handleChipClick('Help me write')">✏️ Help me write</div>
        <div class="chip" onclick="handleChipClick('Give me an idea')">🚀 Give me an idea</div>
        <div class="chip" onclick="handleChipClick('Do some maths')">🧮 Do some maths</div>
      </section>

      <div class="messages-list" id="messagesList"></div>
    </div>

    <!-- Input Footer -->
    <footer class="input-dock">
      <form class="input-container" id="chatForm">
        <button type="button" class="action-icon">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"></path></svg>
        </button>
        <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off" />
        <div class="input-actions">
          <button type="submit" class="btn-send">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"></path></svg>
          </button>
        </div>
      </form>
    </footer>
  </main>

  <script>
    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');
    const messagesList = document.getElementById('messagesList');
    const newChatBtn = document.getElementById('newChatBtn');

    function getCurrentTime() {
      const now = new Date();
      return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
    }

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;

      const row = document.createElement('div');
      row.className = 'message-row user';
      row.innerHTML = `
        <div class="avatar">👤</div>
        <div class="message-content">
          <div class="bubble">${text}</div>
          <div class="timestamp">${getCurrentTime()} ✓✓</div>
        </div>
      `;

      messagesList.appendChild(row);
      messagesList.scrollTop = messagesList.scrollHeight;
      userInput.value = '';
    });

    function handleChipClick(text) {
      userInput.value = text;
      userInput.focus();
    }

    newChatBtn.addEventListener('click', () => {
      messagesList.innerHTML = '';
    });
  </script>
</body>
</html>
