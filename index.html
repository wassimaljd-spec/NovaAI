<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova AI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- SIDEBAR -->
  <aside id="historyPanel" class="sidebar">

    <div class="side-brand">
      <div class="nova-mark">✦</div>

      <div>
        <div class="nova-word">
          NOVA <span>AI</span>
        </div>

        <small>
          Think ✦ Create ✦ Explore
        </small>
      </div>
    </div>

    <button class="side-new" onclick="newChat()">
      ✎ <span>New Chat</span>
    </button>

    <button class="side-item" onclick="toggleHistory()">
      ◷ <span>Chat History</span>
    </button>

    <button class="side-item">
      ⚙ <span>Settings</span>
    </button>

    <div class="side-quote">
      Better questions<br>
      create a brighter<br>
      future. ✦

      <div class="quote-line"></div>
    </div>

  </aside>

  <div
    id="historyOverlay"
    class="history-overlay"
    onclick="toggleHistory()">
  </div>


  <!-- MOBILE HEADER -->

  <div class="mobile-header">

    <button
      class="hamburger"
      onclick="toggleHistory()">
      ☰
    </button>

    <div class="mobile-logo">
      ✦
    </div>

    <div class="mobile-brand">
      <b>Nova AI</b>
      <span>Always ready to help</span>
    </div>

    <button
      class="mobile-new"
      onclick="newChat()">
      + New chat
    </button>

  </div>


  <!-- MAIN -->

  <main class="main">

    <!-- TOP BAR -->

    <header class="topbar">

      <button class="moon">
        ☾
      </button>

      <div class="status">
        ✦ &nbsp; Nova AI
        <i></i>
      </div>

    </header>


    <!-- CHAT -->

    <section id="chat" class="chat">

      <div id="welcome" class="welcome">

        <!-- NOVA ORBIT LOGO -->

        <div class="hero-orbit">

          <div class="orbit-ring"></div>

          <div class="hero-star">
            ✦
          </div>

          <span class="star s1">✦</span>
          <span class="star s2">✦</span>
          <span class="star s3">✦</span>

        </div>


        <h1>
          NOVA <span>AI</span>
        </h1>

        <p class="tagline">
          Your AI assistant
          &nbsp;✦&nbsp;
          Always here for you
        </p>


        <!-- QUICK BUTTONS -->

        <div class="suggestions">

          <button
            onclick="suggest('Explain something to me')">

            ♧

            <span>
              Explain<br>
              something
            </span>

          </button>


          <button
            onclick="suggest('Help me write something')">

            ✎

            <span>
              Help me<br>
              write
            </span>

          </button>


          <button
            onclick="suggest('Give me an idea')">

            ♢

            <span>
              Give me<br>
              an idea
            </span>

          </button>


          <button
            onclick="suggest('Can you do some maths?')">

            ▣

            <span>
              Do some<br>
              maths
            </span>

          </button>

        </div>

      </div>

    </section>


    <!-- INPUT -->

    <footer class="input-area">

      <div class="input-box">

        <button class="attach">
          ♧
        </button>

        <textarea
          id="message"
          rows="1"
          placeholder="Type a message..."
          onkeydown="handleKey(event)"
          oninput="autoResize(this)">
        </textarea>

        <button
          class="send"
          onclick="sendMessage()">

          ➤

        </button>

      </div>

      <div class="disclaimer">
        Nova AI can make mistakes. Check important information.
      </div>

    </footer>

  </main>


  <script src="script.js"></script>

</body>
</html>
