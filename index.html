<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nova AI</title>
  <!-- Sleek Modern Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #07030e;
      --purple-glow: rgba(168, 85, 247, 0.45);
      --accent-purple: #a855f7;
      --pill-border: rgba(168, 85, 247, 0.35);
      --chip-bg: rgba(255, 255, 255, 0.03);
      --text-primary: #ffffff;
      --text-muted: #9d96b0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
      background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    /* Ambient Breathing Glow Effect */
    body::before {
      content: '';
      position: absolute;
      top: 32%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, var(--purple-glow) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: ambientPulse 6s ease-in-out infinite alternate;
    }

    @keyframes ambientPulse {
      0% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.95); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    }

    /* App Header */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: rgba(7, 3, 14, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hamburger-btn {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
      padding: 4px;
    }

    .hamburger-btn span {
      width: 18px;
      height: 2px;
      background: #ffffff;
      border-radius: 2px;
      display: block;
    }

    .nav-brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.5);
    }

    .brand-logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .brand-name {
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.1;
      color: #ffffff;
      letter-spacing: -0.2px;
    }

    .brand-sub {
      font-size: 0.65rem;
      color: var(--text-muted);
      line-height: 1.1;
    }

    .pill-btn-new {
      background: rgba(168, 85, 247, 0.12);
      border: 1px solid var(--pill-border);
      color: #e9d5ff;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .pill-btn-new:hover {
      background: rgba(168, 85, 247, 0.25);
      border-color: rgba(168, 85, 247, 0.6);
      transform: translateY(-1px);
    }

    /* Hero Main Content */
    .hero-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 24px 140px 24px;
      text-align: center;
      z-index: 1;
    }

    .hero-screen.hidden {
      display: none !important;
    }

    .hero-brand-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      width: 100%;
    }

    .star-logo-container {
      width: 130px;
      height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      filter: drop-shadow(0 0 28px rgba(168, 85, 247, 0.65));
      transition: transform 0.3s ease;
    }

    .star-logo-container:hover {
      transform: scale(1.03);
    }

    .hero-logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .nova-title-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .nova-title-svg {
      width: 220px;
      height: auto;
      display: block;
      filter: drop-shadow(0 0 14px rgba(168, 85, 247, 0.5));
    }

    .tagline {
      font-size: 0.82rem;
      letter-spacing: 2.5px;
      color: #d8b4fe;
      margin-bottom: 24px;
      font-weight: 600;
      text-transform: uppercase;
      opacity: 0.9;
    }

    .hero-prompt {
      font-size: 1.65rem;
      font-weight: 800;
      margin-bottom: 10px;
      background: linear-gradient(180deg, #ffffff 30%, #e9d5ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .hero-description {
      font-size: 0.9rem;
      color: var(--text-muted);
      max-width: 380px;
      line-height: 1.55;
      margin-bottom: 30px;
    }

    .chips-group {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .chip-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* Glassmorphism Glowing Chips */
    .prompt-chip {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--pill-border);
      color: var(--text-primary);
      padding: 10px 18px;
      border-radius: 24px;
      font-size: 0.84rem;
      font-weight: 500;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: inset 0 0 12px rgba(168, 85, 247, 0.08);
    }

    .prompt-chip:hover {
      background: rgba(168, 85, 247, 0.18);
      border-color: rgba(168, 85, 247, 0.6);
      transform: translateY(-3px);
      box-shadow: inset 0 0 16px rgba(168, 85, 247, 0.2), 0 6px 18px rgba(168, 85, 247, 0.25);
    }

    /* Active Chat Feed */
    .chat-feed {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 20px 20px 140px 20px;
      overflow-y: auto;
      z-index: 1;
      max-width: 620px;
      margin: 0 auto;
      width: 100%;
    }

    .chat-feed.hidden {
      display: none !important;
    }

    .msg-wrapper {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      max-width: 88%;
      animation: fadeIn 0.25s ease-out;
    }

    .msg-wrapper.user-wrapper {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-wrapper.ai-wrapper {
      align-self: flex-start;
    }

    .ai-avatar {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #a855f7, #6b21a8);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 8px rgba(168, 85, 247, 0.4);
      margin-top: 2px;
    }

    .ai-avatar svg {
      width: 16px;
      height: 16px;
      fill: #ffffff;
    }

    .msg-bubble {
      padding: 12px 18px;
      border-radius: 18px;
      font-size: 0.92rem;
      line-height: 1.5;
      word-wrap: break-word;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Vibrant Gradient User Message Bubbles */
    .user-msg {
      background: linear-gradient(135deg, #a855f7, #7e22ce);
      color: #ffffff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 14px rgba(168, 85, 247, 0.3);
    }

    /* Glassmorphism AI Message Bubbles */
    .ai-msg {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(168, 85, 247, 0.2);
      color: #f3e8ff;
      border-bottom-left-radius: 4px;
      backdrop-filter: blur(8px);
    }

    /* Typing Dots Indicator */
    .typing-indicator {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 14px 18px;
    }

    .typing-indicator span {
      width: 6px;
      height: 6px;
      background: #d8b4fe;
      border-radius: 50%;
      animation: pulse 1.2s infinite ease-in-out;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.1); }
    }

    /* Fixed Input Dock & Usage Limit Counter */
    .input-dock-fixed {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 20px 18px 20px;
      background: linear-gradient(to top, #07030e 85%, transparent);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .response-limit-pill {
      font-size: 0.72rem;
      font-weight: 600;
      color: #d8b4fe;
      background: rgba(168, 85, 247, 0.12);
      border: 1px solid rgba(168, 85, 247, 0.3);
      padding: 3px 12px;
      border-radius: 12px;
      letter-spacing: 0.3px;
      backdrop-filter: blur(8px);
    }

    .input-bar {
      width: 100%;
      max-width: 540px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 30px;
      padding: 6px 8px 6px 20px;
      display: flex;
      align-items: center;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      transition: border-color 0.25s ease;
    }

    .input-bar:focus-within {
      border-color: rgba(168, 85, 247, 0.7);
      box-shadow: 0 0 16px rgba(168, 85, 247, 0.25);
    }

    .input-bar input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 0.92rem;
      width: 100%;
    }

    .input-bar input:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .send-circle-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #a855f7, #7e22ce);
      border: none;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s ease;
      box-shadow: 0 2px 10px rgba(168, 85, 247, 0.4);
    }

    .send-circle-btn:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 4px 14px rgba(168, 85, 247, 0.6);
    }

    .send-circle-btn:disabled {
      background: #4a2173;
      cursor: not-allowed;
      opacity: 0.5;
      box-shadow: none;
    }
  </style>
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="header-left">
      <button class="hamburger-btn" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="nav-brand-group">
        <div class="nav-brand-icon">
          <svg viewBox="0 0 500 500" class="brand-logo-img" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="cardGradNav" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#500f80" />
                <stop offset="100%" stop-color="#1d0438" />
              </linearGradient>
              <linearGradient id="borderGradNav" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#c084fc" />
                <stop offset="100%" stop-color="#581c87" />
              </linearGradient>
              <linearGradient id="starCoreNav" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="50%" stop-color="#e9d5ff" />
                <stop offset="100%" stop-color="#a855f7" />
              </linearGradient>
              <linearGradient id="orbitGradNav" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="60%" stop-color="#c084fc" />
                <stop offset="100%" stop-color="#6b21a8" />
              </linearGradient>
            </defs>
            <rect x="50" y="50" width="400" height="400" rx="90" fill="url(#cardGradNav)" stroke="url(#borderGradNav)" stroke-width="8" />
            <path d="M 330 180 C 400 170 410 220 370 250" fill="none" stroke="url(#orbitGradNav)" stroke-width="12" stroke-linecap="round" />
            <path d="M 250 140 Q 250 250 360 250 Q 250 250 250 360 Q 250 250 140 250 Q 250 250 250 140 Z" fill="url(#starCoreNav)" />
            <path d="M 10 400 C 0 320 120 280 220 380" fill="none" stroke="url(#orbitGradNav)" stroke-width="14" stroke-linecap="round" />
          </svg>
        </div>
        <div>
          <h1 class="brand-name">Nova AI</h1>
          <p class="brand-sub">Always ready to help</p>
        </div>
      </div>
    </div>

    <button class="pill-btn-new" id="new-chat-btn">+ New chat</button>
  </header>

  <!-- Hero Screen (Welcome View) -->
  <main class="hero-screen" id="hero-screen">
    <div class="hero-brand-stack">
      <div class="star-logo-container">
        <svg viewBox="0 0 500 500" class="hero-logo-img" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="cardGradHero" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#4a0e78" />
              <stop offset="100%" stop-color="#190333" />
            </linearGradient>
            <linearGradient id="borderGradHero" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#a855f7" />
              <stop offset="100%" stop-color="#3b0764" />
            </linearGradient>
            <linearGradient id="starCoreHero" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="40%" stop-color="#f3e8ff" />
              <stop offset="100%" stop-color="#c084fc" />
            </linearGradient>
            <linearGradient id="orbitGradHero" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="70%" stop-color="#c084fc" />
              <stop offset="100%" stop-color="#7e22ce" />
            </linearGradient>
          </defs>

          <rect x="60" y="60" width="380" height="380" rx="85" fill="url(#cardGradHero)" stroke="url(#borderGradHero)" stroke-width="6" />
          <path d="M 270 190 C 390 150 400 230 350 245" fill="none" stroke="url(#orbitGradHero)" stroke-width="14" stroke-linecap="round" />
          <path d="M 250 130 Q 250 250 370 250 Q 250 250 250 370 Q 250 250 130 250 Q 250 250 250 130 Z" fill="url(#starCoreHero)" />
          <path d="M 5 380 C 10 280 130 260 210 360" fill="none" stroke="url(#orbitGradHero)" stroke-width="14" stroke-linecap="round" />
          <path d="M 40 250 Q 40 260 50 260 Q 40 260 40 270 Q 40 260 30 260 Q 40 260 40 250 Z" fill="#e9d5ff" />
          <path d="M 470 250 Q 470 260 480 260 Q 470 260 470 270 Q 470 260 460 260 Q 470 260 470 250 Z" fill="#e9d5ff" />
        </svg>
      </div>

      <!-- Perfect Center Nova Title SVG -->
      <div class="nova-title-container">
        <svg viewBox="0 0 260 50" class="nova-title-svg" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="novaTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="60%" stop-color="#e9d5ff" />
              <stop offset="100%" stop-color="#a855f7" />
            </linearGradient>
          </defs>
          <g fill="url(#novaTextGrad)" transform="translate(14, 0)">
            <path d="M 10 40 L 10 10 L 18 10 L 32 30 L 32 10 L 40 10 L 40 40 L 32 40 L 18 20 L 18 40 Z" />
            <path d="M 52 10 L 76 10 C 82 10 86 14 86 20 L 86 30 C 86 36 82 40 76 40 L 52 40 C 46 40 42 36 42 30 L 42 20 C 42 14 46 10 52 10 Z M 52 17 C 50 17 49 18 49 20 L 49 30 C 49 32 50 33 52 33 L 76 33 C 78 33 79 32 79 30 L 79 20 C 79 18 78 17 76 17 Z" />
            <path d="M 92 10 L 100 10 L 109 32 L 118 10 L 126 10 L 113 40 L 105 40 Z" />
            <path d="M 132 40 L 145 10 L 153 10 L 166 40 L 158 40 L 149 18 L 140 40 Z" />
            <path d="M 190 40 L 203 10 L 211 10 L 224 40 L 216 40 L 207 18 L 198 40 Z" />
            <path d="M 232 10 L 240 10 L 240 40 L 232 40 Z" />
          </g>
        </svg>
      </div>
    </div>

    <p class="tagline">Think ✦ Create ✦ Explore</p>

    <h2 class="hero-prompt">What can I help you with?</h2>
    <p class="hero-description">
      Ask me anything. I'm here to help you learn, create and explore.
    </p>

    <div class="chips-group">
      <div class="chip-row">
        <button class="prompt-chip" type="button" data-prompt="Explain quantum physics in simple terms">💡 Explain something</button>
        <button class="prompt-chip" type="button" data-prompt="Help me write a creative sci-fi story">✍️ Help me write</button>
        <button class="prompt-chip" type="button" data-prompt="Give me a creative web app idea">🚀 Give me an idea</button>
      </div>
    </div>
  </main>

  <!-- Active Chat Feed -->
  <div class="chat-feed hidden" id="chat-feed"></div>

  <!-- Bottom Input Bar & Response Counter -->
  <div class="input-dock-fixed">
    <div class="response-limit-pill" id="limit-pill">
      Responses left: <span id="responses-left">10</span>/10
    </div>
    <form class="input-bar" id="chat-form">
      <input type="text" id="user-input" placeholder="Type your message..." autocomplete="off" />
      <button type="submit" class="send-circle-btn" id="send-btn">➔</button>
    </form>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const heroScreen = document.getElementById("hero-screen");
      const chatFeed = document.getElementById("chat-feed");
      const chatForm = document.getElementById("chat-form");
      const userInput = document.getElementById("user-input");
      const sendBtn = document.getElementById("send-btn");
      const newChatBtn = document.getElementById("new-chat-btn");
      const promptChips = document.querySelectorAll(".prompt-chip");
      const responsesLeftSpan = document.getElementById("responses-left");
      const limitPill = document.getElementById("limit-pill");

      const MAX_RESPONSES = 10;
      let responsesRemaining = MAX_RESPONSES;

      const aiResponses = {
        "Explain quantum physics in simple terms": "Imagine subatomic particles acting like spinning coins that are both heads and tails at the same time until you look at them!",
        "Help me write a creative sci-fi story": "I'd love to help! Tell me about your main character or setting, and we'll craft the scene together.",
        "Give me a creative web app idea": "How about an interactive ambient productivity app where completing tasks builds a virtual glowing galaxy?"
      };

      function updateCounter() {
        if (responsesLeftSpan) responsesLeftSpan.textContent = responsesRemaining;
        
        if (responsesRemaining <= 0 && limitPill) {
          limitPill.textContent = "Response limit reached for this session";
          limitPill.style.color = "#f87171";
          limitPill.style.borderColor = "rgba(239, 68, 68, 0.4)";
          userInput.disabled = true;
          userInput.placeholder = "Limit reached. Click + New Chat!";
          sendBtn.disabled = true;
        }
      }

      function handleSendMessage(text) {
        if (!text.trim() || responsesRemaining <= 0) return;

        if (heroScreen && !heroScreen.classList.contains("hidden")) {
          heroScreen.classList.add("hidden");
          chatFeed.classList.remove("hidden");
        }

        // Render User Message Wrapper
        const userWrapper = document.createElement("div");
        userWrapper.className = "msg-wrapper user-wrapper";
        
        const userMsg = document.createElement("div");
        userMsg.className = "msg-bubble user-msg";
        userMsg.textContent = text;
        
        userWrapper.appendChild(userMsg);
        chatFeed.appendChild(userWrapper);
        chatFeed.scrollTop = chatFeed.scrollHeight;

        // Render AI Typing Indicator Wrapper with Avatar Icon
        const typingWrapper = document.createElement("div");
        typingWrapper.className = "msg-wrapper ai-wrapper";
        
        const aiAvatar = document.createElement("div");
        aiAvatar.className = "ai-avatar";
        aiAvatar.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/></svg>`;

        const typingIndicator = document.createElement("div");
        typingIndicator.className = "msg-bubble ai-msg typing-indicator";
        typingIndicator.innerHTML = "<span></span><span></span><span></span>";

        typingWrapper.appendChild(aiAvatar);
        typingWrapper.appendChild(typingIndicator);
        chatFeed.appendChild(typingWrapper);
        chatFeed.scrollTop = chatFeed.scrollHeight;

        setTimeout(() => {
          chatFeed.removeChild(typingWrapper);

          responsesRemaining--;
          updateCounter();

          // Render Final AI Message
          const aiWrapper = document.createElement("div");
          aiWrapper.className = "msg-wrapper ai-wrapper";

          const finalAvatar = document.createElement("div");
          finalAvatar.className = "ai-avatar";
          finalAvatar.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/></svg>`;

          const aiMsg = document.createElement("div");
          aiMsg.className = "msg-bubble ai-msg";
          aiMsg.textContent = aiResponses[text] || "I'm Nova AI! How else can I assist you with this?";

          aiWrapper.appendChild(finalAvatar);
          aiWrapper.appendChild(aiMsg);
          chatFeed.appendChild(aiWrapper);
          chatFeed.scrollTop = chatFeed.scrollHeight;
        }, 700);
      }

      if (chatForm) {
        chatForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const text = userInput.value;
          userInput.value = "";
          handleSendMessage(text);
        });
      }

      promptChips.forEach((chip) => {
        chip.addEventListener("click", () => {
          const promptText = chip.getAttribute("data-prompt") || chip.textContent.trim();
          handleSendMessage(promptText);
        });
      });

      if (newChatBtn) {
        newChatBtn.addEventListener("click", () => {
          chatFeed.innerHTML = "";
          chatFeed.classList.add("hidden");
          heroScreen.classList.remove("hidden");
          userInput.value = "";
          
          responsesRemaining = MAX_RESPONSES;
          if (limitPill) {
            limitPill.style.color = "#d8b4fe";
            limitPill.style.borderColor = "rgba(168, 85, 247, 0.3)";
            limitPill.innerHTML = 'Responses left: <span id="responses-left">10</span>/10';
          }
          userInput.disabled = false;
          userInput.placeholder = "Type your message...";
          sendBtn.disabled = false;
        });
      }
    });
  </script>
</body>
</html>
