<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="logo">✦</div>
        <div>
          <h1>Nova AI</h1>
          <span>Always ready to help</span>
        </div>
      </div>

      <button class="new-chat" type="button" onclick="newChat()">+ New chat</button>
    </header>

    <main id="chat" class="chat">
      <section class="welcome" id="welcome">
        <div class="welcome-icon">🤖</div>
        <h2>What can I help you with?</h2>
        <p>Ask me anything. I'm here to help you learn, create and explore.</p>

        <div class="suggestions">
          <button type="button" onclick="suggest('Explain something to me')">💡 Explain something</button>
          <button type="button" onclick="suggest('Help me write something')">✍️ Help me write</button>
          <button type="button" onclick="suggest('Give me an idea')">🚀 Give me an idea</button>
        </div>
      </section>
    </main>

    <footer class="input-area">
      <div class="input-box">
        <textarea id="message" placeholder="Message Nova AI..." rows="1"
          onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send" type="button" onclick="sendMessage()" aria-label="Send message">➤</button>
      </div>
      <p class="disclaimer">Nova AI can make mistakes. Check important information.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
