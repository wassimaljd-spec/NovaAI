<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NOVA AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <div class="brand-icon">✨</div>
        <div>
          <h2 class="brand-title">NOVA AI</h2>
          <p class="brand-subtitle">INTELLIGENT ASSISTANT</p>
        </div>
      </div>

      <button class="btn-new-chat" id="newChatBtn">
        <span>+</span> New Chat
      </button>

      <nav class="nav-list">
        <div class="nav-item">💬 Chat History</div>
        <div class="nav-item">⭐ Favorites</div>
        <div class="nav-item">⚙️ Settings</div>
      </nav>
    </div>

    <div class="sidebar-footer">
      <p>Powered by NOVA Engine<br><small>v2.4 Pro Edition</small></p>
      <span class="footer-sparkle">✦</span>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    
    <!-- Top Bar -->
    <header class="top-bar">
      <button class="icon-btn back-btn" id="backBtn" title="Go Back">←</button>

      <div class="status-badge">
        <span class="status-dot"></span>
        <span>Online</span>
      </div>
      <button class="icon-btn" title="Toggle Theme">🌙</button>
      <button class="icon-btn" title="User Profile">👤</button>
    </header>

    <!-- Chat Container -->
    <div class="chat-container">
      
      <!-- Landing / Welcome Hero Section -->
      <div id="welcomeSection">
        <section class="hero-section">
          <div class="hero-logo">
            <svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                  <feGaussianBlur stdDeviation="4" result="blur" />
                  <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
                <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#ffffff" />
                  <stop offset="50%" stop-color="#e0b3ff" />
                  <stop offset="100%" stop-color="#9d65ff" />
                </linearGradient>
                <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#b17aff" stop-opacity="0.9" />
                  <stop offset="50%" stop-color="#6e3aff" stop-opacity="0.5" />
                  <stop offset="100%" stop-color="#3d148a" stop-opacity="0.2" />
                </linearGradient>
              </defs>

              <circle cx="60" cy="60" r="34" fill="rgba(112, 66, 210, 0.25)" filter="url(#glow)" />
              <circle cx="60" cy="60" r="34" stroke="url(#starGrad)" stroke-width="1.2" stroke-opacity="0.4" />
              <ellipse cx="60" cy="60" rx="46" ry="16" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" transform="rotate(-25 60 60)" filter="url(#glow)" />
              
              <path d="M72 26 L73.5 31.5 L79 33 L73.5 34.5 L72 40 L70.5 34.5 L65 33 L70.5 31.5 Z" fill="#ffffff" filter="url(#glow)" />
              <path d="M26 60 L27.5 63.5 L31 65 L27.5 66.5 L26 70 L24.5 66.5 L21 65 L24.5 63.5 Z" fill="#c39eff" filter="url(#glow)" />
              <path d="M79 70 L80 73 L83 74 L80 75 L79 78 L78 75 L75 74 L78 73 Z" fill="#a26bff" />

              <path d="M60 22 C60 42 42 60 22 60 C42 60 60 78 60 98 C60 78 78 60 98 60 C78 60 60 42 60 22 Z" fill="url(#starGrad)" filter="url(#glow)" />
              <path d="M60 36 C60 48 48 60 36 60 C48 60 60 72 60 84 C60 72 72 60 84 60 C72 60 60 48 60 36 Z" fill="#ffffff" opacity="0.6" />
            </svg>
          </div>
          <h1 class="hero-title">NOVA AI</h1>
          <p class="hero-subtitle">Your AI assistant &nbsp;✦&nbsp; Always here for you</p>
        </section>

        <!-- Prompt Chips -->
        <section class="chips-grid">
          <div class="chip" onclick="handleChipClick('Explain something')">💡 Explain something</div>
          <div class="chip" onclick="handleChipClick('Help me write')">✏️ Help me write</div>
          <div class="chip" onclick="handleChipClick('Give me an idea')">🚀 Give me an idea</div>
          <div class="chip" onclick="handleChipClick('Do some maths')">🧮 Do some maths</div>
        </section>
      </div>

      <!-- Message Feed -->
      <div class="messages-list" id="messagesList"></div>
    </div>

    <!-- Input Dock -->
    <div class="input-dock">
      <form class="input-container" id="chatForm">
        <input type="text" id="userInput" placeholder="Ask NOVA anything..." autocomplete="off" />
        <div class="input-actions">
          <button type="button" class="action-icon" title="Attach file">📎</button>
          <button type="button" class="action-icon" title="Voice input">🎙️</button>
          <button type="submit" class="btn-send" title="Send message">➔</button>
        </div>
      </form>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
